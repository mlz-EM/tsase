run:
  name: pzo_neg111_field_ssneb
  root: runs/pzo_neg111_field_ssneb

path:
  source:
    kind: control_points
    files:
      - structures/AFE_reduced.cif
      - structures/R3c_reduced.cif
    indices: [0, 21]
  num_images: 22

model:
  calculator:
    kind: mace_field
    model_path: models/PZO.model
    device: cuda
    head: ft_head
    default_dtype: float64
  field:
    kind: direction
    basis: crystal
    direction: [-1, -1, -1]
    magnitude: 0.003
  reference:
    kind: file
    file: structures/R3c_reduced.cif

band:
  spring: 3.0
  method: normal
  ss: true
  weight: 1.0

constraints:
  filter:
    mask: [0, 1, 0, 1, 0, 1]
    hydrostatic_strain: false
    constant_volume: false

optimizer:
  kind: fire
  dt: 0.2
  dtmax: 0.2
  maxmove: 0.2
  convergence:
    fmax: 1.0e-02
    max_steps: 1000000000

staging:
  remesh:
    - target_num_images: 77
      max_wait_iterations: 1000000000
      on_miss: error
      spring_scale: 0.3333333333333333
      trigger:
        kind: force_below
        threshold: 2.0e-02
        metric: fmax

outputs:
  schedule:
    every: 200
    include_final: true
  path_snapshot:
    enabled: true
  diagnostics:
    enabled: true
  energy_profile:
    enabled: true
    emit_csv: true
    emit_png: true
    entries:
      - enthalpy_adjusted
      - polarization_mag
  stem:
    enabled: true

preprocess:
  output_dir: preprocessed
  relax:
    enabled: true
    fmax: 5.0e-06
    selection: endpoints
  reference:
    symmetrize: false
    symprec: 1.0
  outputs:
    config_name: run.yaml
